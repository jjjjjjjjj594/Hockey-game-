<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Air Hockey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="topbar">
    <h1>NEON <span>AIR HOCKEY</span></h1>
    <div class="topbar-actions">
      <button id="muteBtn" class="icon-btn" title="Mute/unmute">🔊</button>
      <button id="resetBtn" class="icon-btn" title="Reset match">↺</button>
    </div>
  </div>

  <div class="game-row">

    <div class="stat-panel you">
      <div class="stat-label">YOU</div>
      <div class="stat-score" id="scoreYou">0</div>
      <div class="stat-row"><span>Streak</span><b id="streakYou">0</b></div>
      <div class="stat-row"><span>Top Speed</span><b id="speedYou">0</b></div>
      <div class="stat-row"><span>Power Hits</span><b id="powerYou">0</b></div>
    </div>

    <div class="rink-wrap">
      <div class="flair" id="flair"></div>
      <canvas id="rink" width="640" height="420"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="overlay-card">
          <h2>Ready?</h2>
          <p>Move your mouse (or finger) to control your paddle.<br>First to 7 goals wins.</p>
          <button class="btn-primary" id="startBtn">Tap to Start</button>
        </div>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <div class="overlay-card">
          <h2 id="endTitle">You Win!</h2>
          <p id="endSub">7 — 4</p>
          <button class="btn-primary" id="playAgainBtn">Play Again</button>
        </div>
      </div>
    </div>

    <div class="stat-panel cpu">
      <div class="stat-label">CPU</div>
      <div class="stat-score" id="scoreCpu">0</div>
      <div class="stat-row"><span>Streak</span><b id="streakCpu">0</b></div>
      <div class="stat-row"><span>Top Speed</span><b id="speedCpu">0</b></div>
      <div class="stat-row"><span>Power Hits</span><b id="powerCpu">0</b></div>
    </div>

  </div>

  <p class="hint">Desktop: move your mouse over the rink · Mobile: drag your finger</p>
</div>

<script src="script.js"></script>
</body>
</html>
